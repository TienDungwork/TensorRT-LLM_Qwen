name: tensorrt-qwen

services:
  builder:
    image: ${TENSORRT_LLM_IMAGE:-nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc12}
    profiles: ["build"]
    gpus: all
    ipc: host
    shm_size: 8gb
    ulimits:
      memlock: -1
      stack: 67108864
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
      NVIDIA_DISABLE_REQUIRE: "1"
      PYTHONPATH: /workspace/src
    volumes:
      - ./data:/workspace/data
      - ./resource:/workspace/resource:ro
      - ./src:/workspace/src:ro
      - ./scripts:/workspace/scripts:ro
    command: python3 /workspace/scripts/build_engine_int4.py

  server:
    image: ${TENSORRT_LLM_IMAGE:-nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc12}
    gpus: all
    ipc: host
    shm_size: 8gb
    ulimits:
      memlock: -1
      stack: 67108864
    environment:
      NVIDIA_DISABLE_REQUIRE: "1"
      PYTHONPATH: /workspace/src
    volumes:
      - ./data:/workspace/data
      - ./resource:/workspace/resource:ro
      - ./src:/workspace/src:ro
    ports:
      - "${TRTLLM_PORT:-8000}:8000"
    command: python3 -m tensorrt_qwen.serve

  api:
    build:
      context: ./api
    depends_on:
      - server
    environment:
      TRTLLM_BASE_URL: http://server:8000/v1
    volumes:
      - ./resource:/workspace/resource:ro
    ports:
      - "${QWEN_API_PORT:-8010}:8010"
    command: uvicorn main:app --host 0.0.0.0 --port 8010
