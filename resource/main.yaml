
model:
  id: Qwen/Qwen3-4B
  engine_dir: engines/Qwen3-4B-fp16

tensorrt:
  dtype: float16
  # T4 (sm75) does not support INT4 weight-only GEMM in TensorRT-LLM.
  weight_only_precision: none
  max_batch_size: 1
  max_input_len: 2048
  max_seq_len: 3072
  max_num_tokens: 2048
  load_model_on_cpu: 1
  kv_cache_free_gpu_memory_fraction: 0.25

api:
  timeout_seconds: 180
